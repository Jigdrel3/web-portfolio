<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhutan Centre for Media and Democracy</title>
<meta name="description" content="BCMD nurtures democracy in Bhutan through civic engagement, public discourse and media literacy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&family=Work+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     EDIT ME — quick color reference
     --paper  : the ground — warm cream paper
     --ink    : primary text — deep charcoal-navy, not black
     --maroon : primary accent — headings, hover, the ink-line
     --saffron: secondary accent — used sparingly, glints not fills
     ============================================================ */
  :root{
    --paper: #f6f1e4;
    --paper-dim: #eee3c9;
    --paper-line: rgba(42,26,20,0.16);
    --paper-line-soft: rgba(42,26,20,0.08);
    --ink: #262a3a;
    --ink-soft: #5a5c70;
    --ink-faint: #83859a;
    --maroon: #7a1f2b;
    --maroon-deep: #4f141d;
    --saffron: #e8a33d;
    --saffron-deep: #b9791f;
    --focus: #1b5fa8;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-weight:400;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{ background:var(--maroon); color:var(--paper); }
  h1,h2,h3,.serif{ font-family:'Fraunces', serif; font-weight:500; color:var(--ink); text-wrap:balance; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  a{ color:inherit; }
  img{ max-width:100%; display:block; }
  ul{ list-style:none; }
  button{ font:inherit; }

  .skip-link{
    position:absolute; left:12px; top:-52px; z-index:300;
    background:var(--ink); color:var(--paper); padding:10px 16px;
    font-size:0.85rem; text-decoration:none; transition:top 0.2s ease;
  }
  .skip-link:focus{ top:12px; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:3px; }

  .wrap{ max-width:1180px; margin:0 auto; padding-left:6vw; padding-right:6vw; }
  @media(min-width:1400px){ .wrap{ padding-left:2rem; padding-right:2rem; } }

  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:0.72rem; font-weight:500;
    text-transform:uppercase; letter-spacing:0.11em; color:var(--maroon);
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{ content:""; width:20px; height:1px; background:var(--saffron); }

  /* ---------- signature: the ink-line thread, down the page edge ---------- */
  .thread{
    position:fixed; left:26px; top:0; bottom:0; width:1px;
    background:var(--paper-line); z-index:60; display:none;
  }
  .thread-progress{
    position:absolute; top:0; left:-1px; width:3px; height:0%;
    background:linear-gradient(var(--maroon), var(--saffron));
    transition:height 0.06s linear;
  }
  @media(min-width:900px){ .thread{ display:block; } }

  /* ---------- HEADER ---------- */
  header.site{
    position:sticky; top:0; z-index:100;
    background:rgba(246,241,228,0.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--paper-line);
  }
  .site-bar{ display:flex; align-items:center; justify-content:space-between; gap:16px 24px; padding:16px 0; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:12px; text-decoration:none; min-width:0; }
  .brand img{ height:36px; width:auto; flex-shrink:0; }
  .brand-name{ font-family:'Fraunces', serif; font-weight:500; font-style:italic; font-size:1.05rem; line-height:1.2; color:var(--ink); }

  nav.primary{ display:flex; align-items:center; gap:2px; flex-wrap:wrap; }
  nav.primary a{ display:inline-block; padding:9px 13px; font-size:0.87rem; font-weight:500; text-decoration:none; color:var(--ink-soft); border-radius:2px; }
  nav.primary a:hover{ color:var(--maroon); background:rgba(122,31,43,0.07); }
  @media(max-width:720px){
    nav.primary{ width:100%; order:3; padding-top:8px; border-top:1px solid var(--paper-line-soft); gap:0 2px; }
    nav.primary a{ padding:8px 9px; font-size:0.82rem; }
  }

  /* ---------- HERO ---------- */
  .hero{ position:relative; overflow:hidden; padding:0; }
  .hero-media{ position:relative; min-height:78vh; display:flex; align-items:flex-end; }
  .hero-media img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    filter:sepia(0.18) saturate(0.85) brightness(0.92);
  }
  .hero-overlay{
    position:absolute; inset:0;
    background:
      linear-gradient(0deg, var(--paper) 0%, rgba(246,241,228,0.88) 32%, rgba(246,241,228,0.42) 62%, rgba(246,241,228,0.18) 100%);
  }
  .ink-line{ position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  .ink-line path{
    fill:none; stroke:url(#inkGradient); stroke-width:2.4; stroke-linecap:round;
    stroke-dasharray:1400; stroke-dashoffset:1400;
    animation:draw 2.4s cubic-bezier(.5,0,.15,1) forwards 0.2s;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @media(prefers-reduced-motion: reduce){ .ink-line path{ animation:none; stroke-dashoffset:0; } }

  .hero-content{ position:relative; z-index:3; padding:0 0 68px; width:100%; }
  .hero-content .eyebrow{ margin-bottom:16px; }
  .hero h1{
    font-style:italic; font-weight:500;
    font-size:clamp(2.1rem, 4.6vw, 3.6rem); line-height:1.14; max-width:19ch;
  }
  .hero-mission{ margin-top:34px; padding-top:26px; border-top:1px solid var(--paper-line); display:grid; grid-template-columns:1fr 1.7fr; gap:32px; max-width:920px; }
  .hero-mission .eyebrow{ margin-top:4px; }
  .hero-mission p{ font-size:1.08rem; line-height:1.65; color:var(--ink-soft); max-width:52ch; }
  @media(max-width:760px){ .hero-mission{ grid-template-columns:1fr; gap:12px; } }
  .hero-credit{ position:absolute; right:6vw; bottom:14px; z-index:3; font-size:0.68rem; color:var(--ink-faint); }

  /* ---------- reveal-on-scroll ---------- */
  .reveal{ opacity:0; transform:translateY(28px); transition:opacity 0.85s cubic-bezier(.16,1,.3,1), transform 0.85s cubic-bezier(.16,1,.3,1); }
  .reveal.in{ opacity:1; transform:translateY(0); }
  @media(prefers-reduced-motion: reduce){ .reveal{ transition-duration:0.01s; transform:none; } }

  /* ---------- SECTION SHELL ---------- */
  section{ padding:88px 0; }
  .section-head{ margin-bottom:48px; max-width:60ch; }
  .section-head h2{ font-size:clamp(1.6rem, 2.8vw, 2.2rem); margin-top:12px; font-style:italic; }

  /* ---------- PROGRAMME PIECES (paper cards) ---------- */
  #programmes{ background:var(--paper-dim); border-top:1px solid var(--paper-line); border-bottom:1px solid var(--paper-line); }
  .paper-grid{ display:grid; grid-template-columns:repeat(12,1fr); gap:34px; }
  .piece{
    position:relative; grid-column:span 12; cursor:pointer;
    background:var(--paper); border:1px solid var(--paper-line);
    padding:14px 14px 0; transform:rotate(var(--tilt,0deg));
    transition:transform 0.4s cubic-bezier(.2,.8,.2,1), box-shadow 0.4s ease;
    box-shadow:0 6px 16px -10px rgba(42,26,20,0.25);
  }
  .piece:nth-child(1){ grid-column:span 7; }
  .piece:nth-child(2){ grid-column:span 5; }
  .piece:nth-child(3){ grid-column:span 12; }
  @media(max-width:820px){ .piece{ grid-column:span 12 !important; } }
  .piece:hover, .piece:focus-within{
    transform:rotate(0deg) translateY(-6px);
    box-shadow:0 26px 40px -20px rgba(42,26,20,0.35);
  }
  .piece-frame{ aspect-ratio:16/10; overflow:hidden; background:var(--ink); position:relative; }
  .piece:nth-child(3) .piece-frame{ aspect-ratio:21/9; }
  .piece-frame img{ width:100%; height:100%; object-fit:cover; display:block; filter:sepia(0.15) saturate(0.9) brightness(0.94); transition:transform 0.7s ease; }
  .piece:hover .piece-frame img{ transform:scale(1.045); }
  .piece-frame .frame-fallback{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--paper-dim); color:var(--ink-faint); font-size:0.8rem; }
  .piece-reveal{
    position:absolute; inset:0; display:flex; align-items:flex-end; padding:22px;
    background:linear-gradient(0deg, rgba(122,31,43,0.82), rgba(122,31,43,0) 65%);
    opacity:0; transition:opacity 0.35s ease;
  }
  .piece:hover .piece-reveal, .piece:focus-within .piece-reveal{ opacity:1; }
  .piece-reveal span{ font-family:'Fraunces', serif; font-style:italic; font-size:1.3rem; color:var(--paper); line-height:1.25; }
  .piece-cap{ display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:14px 4px 16px; }
  .piece-cap .num{ font-size:0.72rem; color:var(--maroon); flex-shrink:0; }
  .piece-cap .t{ font-family:'Fraunces', serif; font-style:italic; font-size:1.05rem; color:var(--ink); }
  .piece-btn{ position:absolute; inset:0; width:100%; height:100%; background:none; border:none; padding:0; margin:0; cursor:pointer; }

  /* ---------- VALUES ---------- */
  .values-list{ display:flex; flex-direction:column; }
  .value-row{
    display:grid; grid-template-columns:120px 1fr 2fr; gap:24px; align-items:baseline;
    padding:22px 0; border-top:1px solid var(--paper-line);
  }
  .values-list li:last-child .value-row{ border-bottom:1px solid var(--paper-line); }
  @media(max-width:700px){ .value-row{ grid-template-columns:1fr; gap:6px; } }
  .value-row .idx{ font-family:'JetBrains Mono', monospace; font-size:0.78rem; color:var(--saffron-deep); }
  .value-row h3{ font-size:1.15rem; font-style:italic; font-weight:500; }
  .value-row p{ color:var(--ink-soft); font-size:0.96rem; line-height:1.6; }

  /* ---------- INITIATIVES STRIP ---------- */
  #initiatives{ background:var(--paper-dim); border-top:1px solid var(--paper-line); border-bottom:1px solid var(--paper-line); }
  .init-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:24px; }
  @media(max-width:900px){ .init-grid{ grid-template-columns:repeat(2,1fr); } }
  @media(max-width:520px){ .init-grid{ grid-template-columns:1fr; } }
  .init-card{
    display:block; text-decoration:none; background:var(--paper); border:1px solid var(--paper-line);
    padding:10px 10px 0; transform:rotate(var(--tilt,0deg));
    transition:transform 0.3s cubic-bezier(.2,.8,.2,1), box-shadow 0.3s ease, border-color 0.3s ease;
  }
  .init-card:hover, .init-card:focus-visible{
    transform:rotate(0deg) translateY(-4px); border-color:var(--saffron);
    box-shadow:0 18px 30px -18px rgba(42,26,20,0.35);
  }
  .init-frame{ aspect-ratio:4/3; overflow:hidden; background:var(--ink); display:flex; align-items:center; justify-content:center; }
  .init-frame img{ width:100%; height:100%; object-fit:cover; filter:sepia(0.15) saturate(0.9) brightness(0.94); }
  .init-frame.no-image{ background:linear-gradient(135deg, var(--maroon), var(--maroon-deep)); }
  .init-frame.no-image span{ font-family:'Fraunces', serif; font-style:italic; color:var(--paper); font-size:0.95rem; text-align:center; padding:12px; }
  .init-cap{ padding:12px 4px 14px; }
  .init-cap .t{ font-family:'Fraunces', serif; font-style:italic; font-size:1rem; color:var(--ink); display:block; }
  .init-cap .n{ font-size:0.78rem; color:var(--ink-soft); margin-top:4px; display:block; }
  .init-cap .n em{ font-style:normal; color:var(--maroon); }

  /* ---------- FOOTER / CONTACT ---------- */
  footer.site{ background:var(--maroon-deep); color:var(--paper); padding:64px 0 30px; position:relative; }
  .footer-grid{ display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:48px; padding-bottom:40px; border-bottom:1px solid rgba(246,241,228,0.18); }
  @media(max-width:760px){ .footer-grid{ grid-template-columns:1fr; gap:34px; } }
  .footer-grid h4{ font-family:'JetBrains Mono', monospace; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--saffron); margin-bottom:16px; font-weight:500; }
  .footer-org{ font-family:'Fraunces', serif; font-style:italic; font-size:1.25rem; font-weight:500; color:#fff; max-width:22ch; margin-bottom:14px; }
  .footer-grid address{ font-style:normal; font-size:0.92rem; line-height:1.7; color:rgba(246,241,228,0.78); }
  .footer-grid address a{ text-decoration:underline; text-decoration-color:rgba(246,241,228,0.3); text-underline-offset:3px; }
  .footer-grid address a:hover{ color:var(--saffron); }
  .contact-lines, .social-list{ display:flex; flex-direction:column; gap:10px; font-size:0.92rem; }
  .contact-lines a, .social-list a{ color:var(--paper); text-decoration:none; border-bottom:1px solid rgba(246,241,228,0.25); padding-bottom:2px; width:fit-content; }
  .contact-lines a:hover, .social-list a:hover{ border-color:var(--saffron); color:var(--saffron); }
  .foot-base{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; padding-top:22px; font-size:0.76rem; color:rgba(246,241,228,0.55); }

  /* ---------- LIGHTBOX ---------- */
  .lightbox{
    position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center;
    padding:6vw; background:rgba(38,42,58,0.6); backdrop-filter:blur(2px);
    opacity:0; transition:opacity 0.4s cubic-bezier(.16,1,.3,1);
  }
  .lightbox.open{ display:flex; }
  .lightbox.open.show{ opacity:1; }
  .lightbox-panel{
    background:var(--paper); max-width:640px; width:100%; max-height:84vh; overflow-y:auto;
    padding:40px 40px 34px; position:relative; border:1px solid var(--paper-line);
    transform:scale(0.88) translateY(16px); transform-origin:var(--ox,50%) var(--oy,50%);
    opacity:0; transition:transform 0.45s cubic-bezier(.16,1,.3,1), opacity 0.35s ease;
    box-shadow:0 40px 70px -30px rgba(38,42,58,0.5);
  }
  .lightbox.open.show .lightbox-panel{ transform:scale(1) translateY(0); opacity:1; }
  .lightbox-close{
    position:absolute; top:18px; right:20px; background:none; border:none; cursor:pointer;
    font-family:'JetBrains Mono', monospace; font-size:0.78rem; color:var(--ink-soft); letter-spacing:0.05em;
  }
  .lightbox-close:hover{ color:var(--maroon); }
  .lightbox-panel .num{ font-family:'JetBrains Mono', monospace; font-size:0.75rem; color:var(--maroon); }
  .lightbox-panel h3{ font-style:italic; font-size:1.6rem; margin-top:10px; line-height:1.25; }
  .lightbox-panel .intro{ margin-top:18px; color:var(--ink-soft); line-height:1.68; }
  .lightbox-panel .block{ margin-top:22px; padding-top:18px; border-top:1px solid var(--paper-line); }
  .lightbox-panel .label{ font-family:'JetBrains Mono', monospace; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-faint); margin-bottom:8px; }
  .lightbox-panel ul.activities li{ font-size:0.94rem; line-height:1.6; padding-left:16px; position:relative; margin-bottom:6px; }
  .lightbox-panel ul.activities li::before{ content:"—"; position:absolute; left:0; color:var(--saffron-deep); }
  .lightbox-panel .audience{ font-size:0.92rem; color:var(--ink-soft); }
  .lightbox-panel .visit{ display:inline-block; margin-top:20px; font-size:0.92rem; text-decoration:underline; text-decoration-color:var(--paper-line); text-underline-offset:3px; color:var(--maroon); }
  .lightbox-panel .visit:hover{ text-decoration-color:var(--maroon); }

</style>
</head>
<body>

  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="thread" aria-hidden="true"><div class="thread-progress" id="threadProgress"></div></div>

  <header class="site">
    <div class="wrap site-bar">
      <a class="brand" href="#top" id="brandLink">
        <img id="logoImg" alt="">
        <span class="brand-name" id="brandName"></span>
      </a>
      <nav class="primary" aria-label="Primary" id="primaryNav"></nav>
    </div>
  </header>

  <main id="main">

    <!-- HERO — rendered from content.json's org.vision / org.mission / hero.image -->
    <section class="hero" id="top">
      <div class="hero-media">
        <img id="heroImg" alt="">
        <div class="hero-overlay"></div>
        <svg class="ink-line" viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="inkGradient" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#7a1f2b"/>
              <stop offset="100%" stop-color="#e8a33d"/>
            </linearGradient>
          </defs>
          <path d="M -20 420 C 160 460, 280 260, 460 300 S 700 440, 860 260 S 1040 120, 1020 60"></path>
        </svg>
        <div class="wrap hero-content">
          <p class="eyebrow">Our Vision</p>
          <h1 id="visionText"></h1>
          <div class="hero-mission">
            <p class="eyebrow">Our Mission</p>
            <p id="missionText"></p>
          </div>
        </div>
        <p class="hero-credit" id="heroCredit"></p>
      </div>
    </section>

    <!-- PROGRAMME AREAS — 3 paper pieces, rendered from content.json's programmes[] -->
    <section id="programmes">
      <div class="wrap">
        <div class="section-head reveal">
          <p class="eyebrow">What We Do</p>
          <h2>Programme Areas</h2>
        </div>
        <div class="paper-grid" id="programmeGrid"></div>
      </div>
    </section>

    <!-- ABOUT / VALUES — from content.json's values[] -->
    <section id="about">
      <div class="wrap">
        <div class="section-head reveal">
          <p class="eyebrow">About BCMD</p>
          <h2>Our Values</h2>
        </div>
        <ul class="values-list" id="valuesList"></ul>
      </div>
    </section>

    <!-- INITIATIVES & PUBLICATIONS — from content.json's initiatives[] -->
    <section id="initiatives">
      <div class="wrap">
        <div class="section-head reveal">
          <p class="eyebrow">Explore Further</p>
          <h2>Initiatives &amp; Publications</h2>
        </div>
        <div class="init-grid" id="initGrid"></div>
      </div>
    </section>

  </main>

  <!-- FOOTER / CONTACT — from content.json's contact{} -->
  <footer class="site" id="contact">
    <div class="wrap" id="footerContent"></div>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle">
    <div class="lightbox-panel" id="lightboxPanel">
      <button type="button" class="lightbox-close mono" id="lightboxClose">Close ✕</button>
      <div id="lightboxBody"></div>
    </div>
  </div>

<script>
(async () => {
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let data;
  try {
    const res = await fetch('content.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (err) {
    document.getElementById('main').innerHTML =
      '<div class="wrap" style="padding:80px 0;"><p>Content could not be loaded (content.json). If you opened this file directly, serve it over http:// instead — see the project notes.</p></div>';
    console.error('Could not load content.json —', err);
    return;
  }

  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  const esc = s => (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  /* ---------- header / brand / nav ---------- */
  document.getElementById('logoImg').src = data.org.logo;
  document.getElementById('logoImg').alt = data.org.acronym + ' logo';
  document.getElementById('brandName').innerHTML = data.org.name.replace(' and ', ' &amp; ');
  document.title = data.org.name;

  const navEl = document.getElementById('primaryNav');
  data.nav.forEach(item => {
    const a = el('a', null, esc(item.label));
    a.href = item.href;
    if (item.external) { a.target = '_blank'; a.rel = 'noopener'; }
    navEl.appendChild(a);
  });

  /* ---------- hero ---------- */
  document.getElementById('heroImg').src = data.hero.image;
  document.getElementById('heroImg').alt = data.hero.imageAlt || '';
  document.getElementById('visionText').textContent = data.org.vision + '.';
  document.getElementById('missionText').textContent = data.org.mission + '.';

  /* ---------- programme pieces ---------- */
  const tilts = [-0.7, 0.5, -0.3];
  const programmeGrid = document.getElementById('programmeGrid');
  data.programmes.forEach((p, i) => {
    const piece = el('div', 'piece reveal');
    piece.style.setProperty('--tilt', (tilts[i % tilts.length]) + 'deg');
    piece.style.transitionDelay = (i * 90) + 'ms';

    const frame = el('div', 'piece-frame');
    if (p.image) {
      const img = el('img'); img.src = p.image; img.alt = p.imageAlt || ''; img.loading = 'lazy';
      frame.appendChild(img);
    } else {
      frame.appendChild(el('div', 'frame-fallback', esc(p.title)));
    }
    const revealTag = el('div', 'piece-reveal', `<span>${esc(p.title)}</span>`);
    frame.appendChild(revealTag);
    piece.appendChild(frame);

    const cap = el('div', 'piece-cap');
    cap.innerHTML = `<span class="num mono">${esc(p.number)}</span><span class="t">${esc(p.title)}</span>`;
    piece.appendChild(cap);

    const btn = el('button', 'piece-btn');
    btn.type = 'button';
    btn.setAttribute('aria-label', 'Read more about ' + p.title);
    btn.addEventListener('click', e => openLightbox(p, btn));
    piece.appendChild(btn);

    programmeGrid.appendChild(piece);
  });

  /* ---------- values ---------- */
  const valuesList = document.getElementById('valuesList');
  data.values.forEach((v, i) => {
    const li = el('li');
    const row = el('div', 'value-row reveal');
    row.style.transitionDelay = (i * 70) + 'ms';
    row.innerHTML = `
      <span class="idx">${String(i + 1).padStart(2, '0')}</span>
      <h3>${esc(v.name)}</h3>
      <p>${esc(v.definition)}</p>
    `;
    li.appendChild(row);
    valuesList.appendChild(li);
  });

  /* ---------- initiatives strip ---------- */
  const initTilts = [-0.8, 0.6, -0.4, 0.7];
  const initGrid = document.getElementById('initGrid');
  data.initiatives.forEach((it, i) => {
    const card = el('a', 'init-card reveal');
    card.href = it.href; card.target = '_blank'; card.rel = 'noopener';
    card.style.setProperty('--tilt', initTilts[i % initTilts.length] + 'deg');
    card.style.transitionDelay = (i * 70) + 'ms';

    const frame = it.image
      ? (() => { const f = el('div', 'init-frame'); const img = el('img'); img.src = it.image; img.alt = it.imageAlt || ''; img.loading = 'lazy'; f.appendChild(img); return f; })()
      : el('div', 'init-frame no-image', `<span>${esc(it.name)}</span>`);
    card.appendChild(frame);

    const cap = el('div', 'init-cap');
    cap.innerHTML = `<span class="t">${esc(it.name)} ↗</span><span class="n">${esc(it.note)}</span>`;
    card.appendChild(cap);

    initGrid.appendChild(card);
  });

  /* ---------- footer ---------- */
  const c = data.contact;
  const footerContent = document.getElementById('footerContent');
  footerContent.innerHTML = `
    <div class="footer-grid">
      <div>
        <div class="footer-org">${esc(c.orgLine1)}</div>
        <address>
          <a href="${c.mapHref}" target="_blank" rel="noopener">
            ${c.address.map(esc).join('<br>')}
          </a>
        </address>
      </div>
      <div>
        <h4>Contact</h4>
        <div class="contact-lines">
          <a href="${c.phone.href}">${esc(c.phone.label)}</a>
          <a href="${c.email.href}">${esc(c.email.label)}</a>
        </div>
      </div>
      <div>
        <h4>Follow</h4>
        <div class="social-list">
          ${c.social.map(s => `<a href="${s.href}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join('')}
        </div>
      </div>
    </div>
    <div class="foot-base">
      <span>&copy; ${esc(data.org.name)} (${esc(data.org.acronym)})</span>
      <span>${esc(data.org.mission)}.</span>
    </div>
  `;

  /* ---------- scroll thread ---------- */
  const bar = document.getElementById('threadProgress');
  window.addEventListener('scroll', () => {
    const h = document.documentElement;
    const pct = (h.scrollTop) / (h.scrollHeight - h.clientHeight) * 100;
    bar.style.height = pct + '%';
  }, { passive:true });

  /* ---------- reveal on scroll ---------- */
  const revealEls = document.querySelectorAll('.reveal');
  if (reducedMotion) {
    revealEls.forEach(node => node.classList.add('in'));
  } else {
    const io = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) { entry.target.classList.add('in'); io.unobserve(entry.target); }
      });
    }, { threshold:0.15, rootMargin:'0px 0px -60px 0px' });
    revealEls.forEach(node => io.observe(node));
  }

  /* ---------- lightbox ---------- */
  const lightbox = document.getElementById('lightbox');
  const lightboxPanel = document.getElementById('lightboxPanel');
  const lightboxBody = document.getElementById('lightboxBody');
  let lastFocused = null;

  function openLightbox(p, triggerEl){
    lastFocused = triggerEl;
    const r = triggerEl.getBoundingClientRect();
    lightboxPanel.style.setProperty('--ox', ((r.left + r.width/2) / window.innerWidth * 100) + '%');
    lightboxPanel.style.setProperty('--oy', ((r.top + r.height/2) / window.innerHeight * 100) + '%');

    lightboxBody.innerHTML = `
      <span class="num mono">${esc(p.number)}</span>
      <h3 id="lightboxTitle">${esc(p.title)}</h3>
      <p class="intro">${esc(p.intro)}</p>
      <div class="block">
        <div class="label">Activities</div>
        <ul class="activities">${p.activities.map(a => `<li>${esc(a)}</li>`).join('')}</ul>
      </div>
      <div class="block">
        <div class="label">Audience</div>
        <p class="audience">${esc(p.audience)}</p>
      </div>
      ${p.link ? `<a class="visit" href="${p.link.href}" target="_blank" rel="noopener">Visit ${esc(p.link.label)} ↗</a>` : ''}
    `;
    lightbox.classList.add('open');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      lightbox.classList.add('show');
      document.getElementById('lightboxClose').focus();
    }));
  }
  function closeLightbox(){
    lightbox.classList.remove('show');
    if (lastFocused) lastFocused.focus();
    setTimeout(() => lightbox.classList.remove('open'), reducedMotion ? 0 : 400);
  }
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
    if (e.key === 'Tab' && lightbox.classList.contains('open')) {
      const focusables = lightboxPanel.querySelectorAll('a, button');
      if (!focusables.length) return;
      const first = focusables[0], last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

})();
</script>

</body>
</html>
